<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ea580c">
<title>🍳 Я в натуре Повар</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/styles.css">
<script>(function(){const t=localStorage.getItem('ecosystem_theme_universal_v2');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🍳 Я в натуре Повар</h1>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-outline" onclick="toggleTheme()">🌓</button>
      <a href="../life-hub-v2.0/index.html" class="btn btn-outline" style="font-weight:700;">🏠 Моя Жизнь</a>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat">⭐ Уровень <span id="s-level">1</span></div>
    <div class="stat">✨ <span id="s-xp">0</span> XP</div>
    <div class="stat">🍳 <span id="s-cooked">0</span> блюд</div>
  </div>

  <div class="card" style="border-left:5px solid var(--accent);">
    <h2 style="margin-top:0;">Привет, повар! 🍳</h2>
    <p>Готовим вместе: 30 рецептов, SOS-помощь, план меню.</p>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px;">
    <a href="modules/recipes/index.html" class="btn btn-block" style="flex-direction:column;padding:18px;"><span style="font-size:1.8rem">📖</span>Рецепты</a>
    <a href="modules/fridge/index.html" class="btn btn-block" style="flex-direction:column;padding:18px;background:linear-gradient(135deg,#16a34a,#22c55e);"><span style="font-size:1.8rem">🥕</span>Что в холодильнике?</a>
    <a href="modules/sos/index.html" class="btn btn-danger btn-block" style="flex-direction:column;padding:18px;"><span style="font-size:1.8rem">🆘</span>SOS Повара</a>
    <a href="modules/mealplan/index.html" class="btn btn-block" style="flex-direction:column;padding:18px;background:linear-gradient(135deg,#7c3aed,#a855f7);"><span style="font-size:1.8rem">📅</span>Меню недели</a>
    <a href="modules/favorites/index.html" class="btn btn-outline btn-block" style="flex-direction:column;padding:18px;"><span style="font-size:1.8rem">❤️</span>Избранное</a>
    <a href="modules/settings/index.html" class="btn btn-outline btn-block" style="flex-direction:column;padding:18px;"><span style="font-size:1.8rem">⚙️</span>Настройки</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('ecosystem_theme_universal_v2',next);
}
document.addEventListener('DOMContentLoaded',()=>{
  const s=window.COOK_STORE.getStats();
  document.getElementById('s-level').textContent=s.level||1;
  document.getElementById('s-xp').textContent=s.xp||0;
  document.getElementById('s-cooked').textContent=s.cooked||0;
});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
