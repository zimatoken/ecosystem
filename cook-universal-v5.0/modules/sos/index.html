<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🆘 SOS Повара</title>
<link rel="stylesheet" href="../../css/styles.css">
<script>(function(){const t=localStorage.getItem('ecosystem_theme_universal_v2');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
<style>
.sos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.sos-card{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:.2s;font-weight:700;font-size:1.05rem}
.sos-card:hover{border-color:var(--accent);transform:translateY(-2px)}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="../../index.html" class="btn btn-outline">← На главную</a>
    <h2 style="color:var(--danger);">🆘 SOS Повара</h2>
  </div>
  <div class="card" style="border-left:5px solid var(--danger);"><p style="margin:0;">Что случилось на кухне?</p></div>
  <div class="sos-grid" id="grid"></div>
  <div id="result" style="margin-top:20px;"></div>
</div>
<script src="../../core/sos.js"></script>
<script>
function render(){
  const all = window.COOK_SOS.getAll();
  document.getElementById('grid').innerHTML = all.map(s =>
    '<div class="sos-card" onclick="openSOS(\'' + s.id + '\')">' + s.icon + ' ' + s.title + '</div>'
  ).join('');
}
function openSOS(id){
  const s = window.COOK_SOS.get(id);
  if (!s) return;
  let html = '<div class="card" style="border-left:5px solid var(--accent);">' +
    '<h3 style="margin-top:0;">' + s.icon + ' ' + s.title + '</h3>' +
    '<h4>Что делать:</h4><ol style="line-height:1.8;">' +
    s.steps.map(x => '<li>' + x + '</li>').join('') +
    '</ol>';
  if (s.warnings) {
    html += '<div style="background:#fef3c7;color:#92400e;padding:12px;border-radius:8px;margin-top:12px;">⚠️ ' + s.warnings.join('<br>⚠️ ') + '</div>';
  }
  html += '</div>';
  document.getElementById('result').innerHTML = html;
}
render();
</script>
</body>
</html>
