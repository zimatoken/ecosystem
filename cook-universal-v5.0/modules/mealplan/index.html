<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 Меню недели</title>
<link rel="stylesheet" href="../../css/styles.css">
<script>(function(){const t=localStorage.getItem('ecosystem_theme_universal_v2');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
<style>
.day-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.day-title{font-weight:800;font-size:1.1rem;color:var(--accent);margin-bottom:8px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="../../index.html" class="btn btn-outline">← На главную</a>
    <h2>📅 Меню недели</h2>
  </div>
  <div class="card"><p style="margin:0;">Планируй питание на неделю.</p></div>
  <div id="days"></div>
</div>
<script src="../../core/registry.js"></script>
<script src="../../core/store.js"></script>
<script src="../../data/recipes/omelette.js"></script>
<script src="../../data/recipes/pasta.js"></script>
<script src="../../data/recipes/soup.js"></script>
<script src="../../data/recipes/pancakes.js"></script>
<script src="../../data/recipes/salad.js"></script>
<script src="../../data/recipes/borsch.js"></script>
<script src="../../data/recipes/pizza.js"></script>
<script src="../../data/recipes/syrniki.js"></script>
<script src="../../data/recipes/cheesecake.js"></script>
<script src="../../data/recipes/chicken_kiev.js"></script>
<script src="../../data/recipes/caesar.js"></script>
<script src="../../data/recipes/shakshuka.js"></script>
<script src="../../data/recipes/greek_yogurt.js"></script>
<script src="../../data/recipes/chicken_wings.js"></script>
<script src="../../data/recipes/mashed_potato.js"></script>
<script src="../../data/recipes/buckwheat.js"></script>
<script src="../../data/recipes/pelmeni.js"></script>
<script src="../../data/recipes/blini.js"></script>
<script src="../../data/recipes/tvorog_zapekanka.js"></script>
<script src="../../data/recipes/sharlotka.js"></script>
<script src="../../data/recipes/olivier.js"></script>
<script src="../../data/recipes/vinegret.js"></script>
<script src="../../data/recipes/goulash.js"></script>
<script src="../../data/recipes/plov.js"></script>
<script src="../../data/recipes/ratatouille.js"></script>
<script src="../../data/recipes/lasagna.js"></script>
<script src="../../data/recipes/tacos.js"></script>
<script src="../../data/recipes/carbonara.js"></script>
<script src="../../data/recipes/risotto.js"></script>
<script src="../../data/recipes/tikka.js"></script>
<script>
const DAYS = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
function render(){
  const plan = window.COOK_STORE.getMealPlan();
  document.getElementById('days').innerHTML = DAYS.map(d => {
    const dishes = (plan[d] || []).map(id => {
      const r = window.COOK_GET(id);
      return r ? r.meta.icon + ' ' + r.meta.name : '';
    }).filter(Boolean).join('<br>');
    return '<div class="day-card"><div class="day-title">' + d + '</div>' +
      (dishes || '<span style="color:var(--muted);">Пока пусто</span>') + '</div>';
  }).join('');
}
render();
</script>
</body>
</html>
