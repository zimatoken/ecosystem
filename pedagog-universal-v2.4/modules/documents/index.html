<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📄 Шаблоны документов</title>
<link rel="stylesheet" href="../../css/styles.css">
<script>(function(){const t=localStorage.getItem('ecosystem_theme_universal_v2');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
<style>
.docs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.doc-card { background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 18px; cursor: pointer; transition: .2s; }
.doc-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: var(--shadow-hover); }
.doc-icon { font-size: 2.5rem; margin-bottom: 8px; }
.doc-title { font-weight: 800; font-size: 1.05rem; margin-bottom: 4px; }
.doc-desc { font-size: .85rem; color: var(--muted); margin-bottom: 8px; }
.doc-cat { display: inline-block; padding: 3px 10px; background: var(--accent-soft); border-radius: 8px; font-size: .75rem; font-weight: 700; }

.modal { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.85); display: none; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
.modal.open { display: flex; }
.modal-body { background: var(--card); border-radius: 16px; max-width: 800px; width: 100%; padding: 28px; margin: 40px auto; }

.template-preview {
  background: var(--bg-soft); padding: 24px; border-radius: 12px;
  font-family: 'Courier New', monospace; font-size: .9rem;
  white-space: pre-wrap; line-height: 1.7; color: var(--text);
  max-height: 500px; overflow-y: auto; border: 1px solid var(--border);
}
.copy-btn { margin-top: 16px; }
.print-btn { background: #16a34a; color: #fff; margin-left: 10px; }
.download-btn { background: #0891b2; color: #fff; margin-left: 10px; }
</style>
</head>
<body>
<div class="container">
<div class="header">
  <a href="../../index.html" class="btn btn-outline">← На главную</a>
  <h2>📄 Шаблоны документов</h2>
</div>
<div class="card" style="border-left:5px solid var(--accent);">
  <p style="margin:0;">8 юридически грамотных шаблонов. Заполни и распечатай.</p>
</div>
<div id="grid" class="docs-grid"></div>
</div>

<div class="modal" id="modal" onclick="closeModal(event)">
  <div class="modal-body" id="modal-body" onclick="event.stopPropagation()"></div>
</div>

<script src="../../data/templates/documents.js"></script>
<script>
function render() {
  const list = window.PED_TEMPLATES || [];
  document.getElementById('grid').innerHTML = list.map(t =>
    '<div class="doc-card" onclick="openDoc(\'' + t.id + '\')">' +
      '<div class="doc-icon">' + t.icon + '</div>' +
      '<div class="doc-title">' + t.title + '</div>' +
      '<div class="doc-desc">' + t.desc + '</div>' +
      '<span class="doc-cat">' + t.category + '</span>' +
    '</div>'
  ).join('');
}

function openDoc(id) {
  const t = (window.PED_TEMPLATES || []).find(x => x.id === id);
  if (!t) return;
  let html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">';
  html += '<h2 style="margin:0;">' + t.icon + ' ' + t.title + '</h2>';
  html += '<button onclick="closeModal()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text);">✕</button></div>';
  html += '<p style="color:var(--muted);">' + t.desc + '</p>';
  html += '<div class="template-preview" id="preview">' + t.template + '</div>';
  html += '<button class="btn copy-btn" onclick="copyTemplate(\'' + id + '\')">📋 Скопировать</button>';
  html += '<button class="btn print-btn" onclick="printTemplate()">🖨️ Распечатать</button>';
  html += '<button class="btn download-btn" onclick="downloadTemplate(\'' + id + '\')">📥 Скачать .txt</button>';
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal').classList.add('open');
}

function copyTemplate(id) {
  const t = (window.PED_TEMPLATES || []).find(x => x.id === id);
  if (!t) return;
  navigator.clipboard.writeText(t.template).then(() => {
    alert('✅ Шаблон скопирован! Вставь в Word / Блокнот.');
  });
}

function printTemplate() {
  const t = document.getElementById('preview').innerText;
  const w = window.open();
  w.document.write('<pre style="font-family:monospace;font-size:14px;padding:20px;">' + t + '</pre>');
  w.document.close();
  w.print();
}

function downloadTemplate(id) {
  const t = (window.PED_TEMPLATES || []).find(x => x.id === id);
  if (!t) return;
  const blob = new Blob([t.template], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'шаблон_' + id + '.txt';
  a.click();
  URL.revokeObjectURL(url);
}

function closeModal(e) { if (e && e.target !== e.currentTarget) return; document.getElementById('modal').classList.remove('open'); }

render();
</script>
</body>
</html>
