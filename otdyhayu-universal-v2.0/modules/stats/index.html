<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 Статистика</title>
<link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
<div class="container">
  <div class="header">
    <a href="../../index.html" class="btn-outline">← Назад</a>
    <h2>📊 Статистика медитации</h2>
  </div>
  <div class="card">
    <h3>Последние 7 дней</h3>
    <div id="chart-7d" style="display:flex;align-items:flex-end;height:150px;gap:8px;margin-top:20px;"></div>
  </div>
  <div class="card">
    <h3>Общие показатели</h3>
    <p>Всего сессий: <b id="stat-sessions">0</b></p>
    <p>Всего минут: <b id="stat-minutes">0</b></p>
    <p>Стрик: <b id="stat-streak">0</b> дн.</p>
  </div>
</div>
<script src="../../core/theme.js"></script>
<script>
var stats = JSON.parse(localStorage.getItem('otd_med_stats_v1') || '{"totalSessions":0,"totalMinutes":0,"streak":0,"minutesByDay":{}}');
document.getElementById('stat-sessions').textContent = stats.totalSessions;
document.getElementById('stat-minutes').textContent = stats.totalMinutes;
document.getElementById('stat-streak').textContent = stats.streak;
var chart = document.getElementById('chart-7d');
var html = '';
for (var i = 6; i >= 0; i--) {
  var d = new Date(); d.setDate(d.getDate() - i);
  var key = d.toISOString().split('T')[0];
  var mins = (stats.minutesByDay && stats.minutesByDay[key]) || 0;
  var h = Math.min(100, mins * 2);
  var dayName = d.toLocaleDateString('ru', { weekday: 'short' });
  html += '<div style="flex:1;text-align:center;"><div style="height:'+h+'px;background:var(--accent);border-radius:4px 4px 0 0;min-height:4px;"></div><div style="font-size:0.7rem;margin-top:4px;color:var(--muted);">'+dayName+'</div><div style="font-size:0.7rem;font-weight:700;">'+mins+'м</div></div>';
}
chart.innerHTML = html;
</script>
</body>
</html>
