<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Библиотека книг</title>
<link rel="stylesheet" href="../../css/styles.css">
<style>
.search-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.search-bar input { flex: 1; min-width: 200px; padding: 12px 16px; border: 2px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); font-size: 1rem; }
.genre-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.genre-tab { padding: 10px 18px; background: var(--card); border: 2px solid var(--border); border-radius: 10px; cursor: pointer; font-weight: 600; transition: .2s; }
.genre-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
.books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.book-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; cursor: pointer; transition: .2s; position: relative; }
.book-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
.book-card.added { border-left: 5px solid var(--success); }
.book-header { display: flex; gap: 12px; margin-bottom: 12px; }
.book-icon { font-size: 2.5rem; }
.book-info { flex: 1; }
.book-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; }
.book-author { font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
.book-year { font-size: 0.75rem; color: var(--muted); }
.book-ratings { display: flex; gap: 12px; margin: 10px 0; font-size: 0.85rem; }
.rating-ours { color: #f59e0b; font-weight: 700; }
.rating-gr { color: #64748b; font-size: 0.8rem; }
.book-desc { font-size: 0.9rem; line-height: 1.5; color: var(--text); margin-bottom: 12px; }
.book-genre { display: inline-block; padding: 4px 10px; background: var(--bg); border-radius: 6px; font-size: 0.75rem; font-weight: 600; color: var(--muted); }
.btn-add { width: 100%; padding: 10px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; margin-top: 10px; }
.btn-add:hover { opacity: 0.9; }
.btn-add.added { background: #64748b; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 1000; padding: 20px; overflow-y: auto; backdrop-filter: blur(4px); }
.modal.open { display: flex; align-items: center; justify-content: center; }
.modal-box { max-width: 600px; width: 100%; background: var(--card); border-radius: 20px; padding: 28px; position: relative; max-height: 90vh; overflow-y: auto; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="index.html" class="btn btn-outline">← Назад к Чтению</a>
    <h2>📚 Библиотека книг</h2>
  </div>

  <div class="card" style="border-left: 5px solid var(--accent);">
    <p id="ai-library" style="font-size: 1rem; font-style: italic; margin: 0;"></p>
  </div>

  <div class="search-bar">
    <input type="text" id="search-input" placeholder="🔍 Поиск по названию или автору...">
  </div>

  <div class="genre-tabs" id="genre-tabs"></div>

  <div class="books-grid" id="books-grid"></div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modal-box"></div>
</div>

<script src="../../core/theme.js"></script>
<script src="../../core/identity.js"></script>
<script src="../../core/chronicle.js"></script>
<script src="data/books_classic.js"></script>
<script src="data/books_scifi.js"></script>
<script src="data/books_detective.js"></script>
<script src="data/books_fantasy.js"></script>
<script src="data/books_nonfic.js"></script>
<script src="data/books_selfdev.js"></script>
<script>
var GENRES = [
  {id:'all', name:'Все', icon:'📚'},
  {id:'classic', name:'Классика', icon:''},
  {id:'scifi', name:'Фантастика', icon:'🚀'},
  {id:'detective', name:'Детективы', icon:'🕵️'},
  {id:'fantasy', name:'Фэнтези', icon:'🧙'},
  {id:'nonfic', name:'Нон-фикшн', icon:'💡'},
  {id:'selfdev', name:'Саморазвитие', icon:''}
];

var currentGenre = 'all';
var searchQuery = '';

function getAllBooks() {
  var books = [];
  if (window.OTD_BOOKS_CLASSIC) books = books.concat(window.OTD_BOOKS_CLASSIC);
  if (window.OTD_BOOKS_SCIFI) books = books.concat(window.OTD_BOOKS_SCIFI);
  if (window.OTD_BOOKS_DETECTIVE) books = books.concat(window.OTD_BOOKS_DETECTIVE);
  if (window.OTD_BOOKS_FANTASY) books = books.concat(window.OTD_BOOKS_FANTASY);
  if (window.OTD_BOOKS_NONFIC) books = books.concat(window.OTD_BOOKS_NONFIC);
  if (window.OTD_BOOKS_SELFDEV) books = books.concat(window.OTD_BOOKS_SELFDEV);
  return books;
}

function getAddedBooks() {
  return JSON.parse(localStorage.getItem('otd_reading_library_added') || '[]');
}

function renderGenreTabs() {
  document.getElementById('genre-tabs').innerHTML = GENRES.map(function(g) {
    return '<div class="genre-tab ' + (g.id === currentGenre ? 'active' : '') + '" onclick="setGenre(\'' + g.id + '\')">' + g.icon + ' ' + g.name + '</div>';
  }).join('');
}

function setGenre(id) {
  currentGenre = id;
  renderGenreTabs();
  renderBooks();
}

function renderBooks() {
  var books = getAllBooks();
  var added = getAddedBooks();
  
  if (currentGenre !== 'all') {
    books = books.filter(function(b) { return b.genre === currentGenre; });
  }
  
  if (searchQuery) {
    var q = searchQuery.toLowerCase();
    books = books.filter(function(b) {
      return b.name.toLowerCase().includes(q) || b.author.toLowerCase().includes(q);
    });
  }
  
  document.getElementById('books-grid').innerHTML = books.map(function(b) {
    var isAdded = added.indexOf(b.id) !== -1;
    var stars = '★'.repeat(Math.round(b.rating)) + '☆'.repeat(5 - Math.round(b.rating));
    return '<div class="book-card ' + (isAdded ? 'added' : '') + '" onclick="openBook(\'' + b.id + '\')">' +
      '<div class="book-header">' +
        '<div class="book-icon">' + b.icon + '</div>' +
        '<div class="book-info">' +
          '<div class="book-title">' + b.name + '</div>' +
          '<div class="book-author">' + b.author + '</div>' +
          '<div class="book-year">' + b.year + ' · ' + b.pages + ' стр</div>' +
        '</div>' +
      '</div>' +
      '<div class="book-ratings">' +
        '<span class="rating-ours">Наш рейтинг: ' + stars + ' ' + b.rating.toFixed(1) + '</span>' +
        '<span class="rating-gr">Goodreads: ' + b.gr_rating + '</span>' +
      '</div>' +
      '<div class="book-desc">' + b.desc + '</div>' +
      '<span class="book-genre">' + GENRES.find(function(g) { return g.id === b.genre; }).icon + ' ' + GENRES.find(function(g) { return g.id === b.genre; }).name + '</span>' +
      '<button class="btn-add ' + (isAdded ? 'added' : '') + '" onclick="event.stopPropagation();toggleBook(\'' + b.id + '\', \'' + b.name + '\')">' + (isAdded ? '✅ В списке' : '📖 Хочу прочитать (+10 XP)') + '</button>' +
    '</div>';
  }).join('') || '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted);">Ничего не найдено</div>';
}

function openBook(id) {
  var b = getAllBooks().find(function(x) { return x.id === id; });
  if (!b) return;
  var added = getAddedBooks();
  var isAdded = added.indexOf(b.id) !== -1;
  var stars = '★'.repeat(Math.round(b.rating)) + '☆'.repeat(5 - Math.round(b.rating));
  
  document.getElementById('modal-box').innerHTML =
    '<button onclick="closeModal()" style="position:absolute;top:16px;right:16px;background:none;border:none;font-size:1.5rem;cursor:pointer;">✕</button>' +
    '<div style="font-size:4rem; text-align:center;">' + b.icon + '</div>' +
    '<h2 style="text-align:center; margin:12px 0;">' + b.name + '</h2>' +
    '<div style="text-align:center; color:var(--muted); margin-bottom:16px;">' + b.author + ' · ' + b.year + ' · ' + b.pages + ' стр</div>' +
    '<div style="display:flex; justify-content:center; gap:20px; margin-bottom:20px;">' +
      '<div style="text-align:center;"><div style="font-size:1.5rem; color:#f59e0b;">' + stars + '</div><div style="font-size:0.85rem; color:var(--muted);">Наш рейтинг</div></div>' +
      '<div style="text-align:center;"><div style="font-size:1.5rem; color:#64748b;">' + b.gr_rating + '</div><div style="font-size:0.85rem; color:var(--muted);">Goodreads</div></div>' +
    '</div>' +
    '<p style="line-height:1.6; font-size:1.05rem; margin-bottom:20px;">' + b.desc + '</p>' +
    '<button class="btn-add ' + (isAdded ? 'added' : '') + '" onclick="toggleBook(\'' + b.id + '\', \'' + b.name + '\'); closeModal();">' + (isAdded ? '✅ Уже в списке' : '📖 Хочу прочитать (+10 XP)') + '</button>';
  document.getElementById('modal').classList.add('open');
}

function toggleBook(id, name) {
  var added = getAddedBooks();
  var idx = added.indexOf(id);
  if (idx === -1) {
    added.push(id);
    localStorage.setItem('otd_reading_library_added', JSON.stringify(added));
    window.OTD_IDENTITY.addXP(10);
    window.OTD_CHRONICLE.add('📚 Добавил в библиотеку: ' + name);
    alert('✅ Добавлено! +10 XP');
  } else {
    added.splice(idx, 1);
    localStorage.setItem('otd_reading_library_added', JSON.stringify(added));
    alert('Убрано из списка');
  }
  renderBooks();
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

document.getElementById('search-input').addEventListener('input', function(e) {
  searchQuery = e.target.value;
  renderBooks();
});

document.getElementById('ai-library').innerHTML = window.OTD_IDENTITY.getGreeting() + '<br><br>📚 Не знаешь, что почитать? Здесь 60 проверенных книг с рейтингами и описаниями!';

renderGenreTabs();
renderBooks();
</script>
</body>
</html>
