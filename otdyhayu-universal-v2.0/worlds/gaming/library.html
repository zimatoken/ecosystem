<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Библиотека игр</title>
<link rel="stylesheet" href="../../css/styles.css">
<style>
.search-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.search-bar input { flex: 1; min-width: 200px; padding: 12px 16px; border: 2px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); font-size: 1rem; }
.genre-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.genre-tab { padding: 10px 18px; background: var(--card); border: 2px solid var(--border); border-radius: 10px; cursor: pointer; font-weight: 600; transition: .2s; }
.genre-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
.games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.game-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; cursor: pointer; transition: .2s; position: relative; }
.game-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
.game-card.added { border-left: 5px solid var(--success); }
.game-header { display: flex; gap: 12px; margin-bottom: 12px; }
.game-icon { font-size: 2.5rem; }
.game-info { flex: 1; }
.game-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; }
.game-meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
.game-platforms { display: flex; gap: 6px; margin-top: 4px; }
.platform { font-size: 0.7rem; background: var(--bg); padding: 2px 6px; border-radius: 4px; }
.game-ratings { display: flex; gap: 12px; margin: 10px 0; font-size: 0.85rem; }
.rating-ours { color: #f59e0b; font-weight: 700; }
.rating-mc { color: #64748b; font-size: 0.8rem; }
.game-desc { font-size: 0.9rem; line-height: 1.5; color: var(--text); margin-bottom: 12px; }
.game-genre { display: inline-block; padding: 4px 10px; background: var(--bg); border-radius: 6px; font-size: 0.75rem; font-weight: 600; color: var(--muted); }
.btn-add { width: 100%; padding: 10px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; margin-top: 10px; }
.btn-add:hover { opacity: 0.9; }
.btn-add.added { background: #64748b; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 1000; padding: 20px; overflow-y: auto; backdrop-filter: blur(4px); }
.modal.open { display: flex; align-items: center; justify-content: center; }
.modal-box { max-width: 600px; width: 100%; background: var(--card); border-radius: 20px; padding: 28px; position: relative; max-height: 90vh; overflow-y: auto; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="index.html" class="btn btn-outline">← Назад к Играм</a>
    <h2>🎮 Библиотека игр</h2>
  </div>

  <div class="card" style="border-left: 5px solid var(--accent);">
    <p id="ai-library" style="font-size: 1rem; font-style: italic; margin: 0;"></p>
  </div>

  <div class="search-bar">
    <input type="text" id="search-input" placeholder="🔍 Поиск по названию игры...">
  </div>

  <div class="genre-tabs" id="genre-tabs"></div>

  <div class="games-grid" id="games-grid"></div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modal-box"></div>
</div>

<script src="../../core/theme.js"></script>
<script src="../../core/identity.js"></script>
<script src="../../core/chronicle.js"></script>
<script src="data/games_rpg.js"></script>
<script src="data/games_shooter.js"></script>
<script src="data/games_strategy.js"></script>
<script src="data/games_indie.js"></script>
<script src="data/games_puzzle.js"></script>
<script src="data/games_simulator.js"></script>
<script>
var GENRES = [
  {id:'all', name:'Все', icon:''},
  {id:'rpg', name:'RPG', icon:'⚔️'},
  {id:'shooter', name:'Шутеры', icon:'🔫'},
  {id:'strategy', name:'Стратегии', icon:'♟️'},
  {id:'indie', name:'Инди', icon:'🎨'},
  {id:'puzzle', name:'Головоломки', icon:'🧩'},
  {id:'simulator', name:'Симуляторы', icon:'️'}
];

var currentGenre = 'all';
var searchQuery = '';

function getAllGames() {
  var games = [];
  if (window.OTD_GAMES_RPG) games = games.concat(window.OTD_GAMES_RPG);
  if (window.OTD_GAMES_SHOOTER) games = games.concat(window.OTD_GAMES_SHOOTER);
  if (window.OTD_GAMES_STRATEGY) games = games.concat(window.OTD_GAMES_STRATEGY);
  if (window.OTD_GAMES_INDIE) games = games.concat(window.OTD_GAMES_INDIE);
  if (window.OTD_GAMES_PUZZLE) games = games.concat(window.OTD_GAMES_PUZZLE);
  if (window.OTD_GAMES_SIMULATOR) games = games.concat(window.OTD_GAMES_SIMULATOR);
  return games;
}

function getAddedGames() {
  return JSON.parse(localStorage.getItem('otd_gaming_library_added') || '[]');
}

function renderGenreTabs() {
  document.getElementById('genre-tabs').innerHTML = GENRES.map(function(g) {
    return '<div class="genre-tab ' + (g.id === currentGenre ? 'active' : '') + '" onclick="setGenre(\'' + g.id + '\')">' + g.icon + ' ' + g.name + '</div>';
  }).join('');
}

function setGenre(id) {
  currentGenre = id;
  renderGenreTabs();
  renderGames();
}

function renderGames() {
  var games = getAllGames();
  var added = getAddedGames();
  
  if (currentGenre !== 'all') {
    games = games.filter(function(g) { return g.genre === currentGenre; });
  }
  
  if (searchQuery) {
    var q = searchQuery.toLowerCase();
    games = games.filter(function(g) {
      return g.name.toLowerCase().includes(q) || g.developer.toLowerCase().includes(q);
    });
  }
  
  document.getElementById('games-grid').innerHTML = games.map(function(g) {
    var isAdded = added.indexOf(g.id) !== -1;
    var stars = '★'.repeat(Math.round(g.rating)) + '☆'.repeat(5 - Math.round(g.rating));
    var platforms = (g.platforms || []).map(function(p) { return '<span class="platform">' + p + '</span>'; }).join('');
    return '<div class="game-card ' + (isAdded ? 'added' : '') + '" onclick="openGame(\'' + g.id + '\')">' +
      '<div class="game-header">' +
        '<div class="game-icon">' + g.icon + '</div>' +
        '<div class="game-info">' +
          '<div class="game-title">' + g.name + '</div>' +
          '<div class="game-meta">' + g.developer + ' · ' + g.year + '</div>' +
          '<div class="game-platforms">' + platforms + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="game-ratings">' +
        '<span class="rating-ours">Наш рейтинг: ' + stars + ' ' + g.rating.toFixed(1) + '</span>' +
        '<span class="rating-mc">Metacritic: ' + g.mc_rating + '</span>' +
      '</div>' +
      '<div class="game-desc">' + g.desc + '</div>' +
      '<span class="game-genre">' + GENRES.find(function(gen) { return gen.id === g.genre; }).icon + ' ' + GENRES.find(function(gen) { return gen.id === g.genre; }).name + '</span>' +
      '<button class="btn-add ' + (isAdded ? 'added' : '') + '" onclick="event.stopPropagation();toggleGame(\'' + g.id + '\', \'' + g.name + '\')">' + (isAdded ? '✅ В списке' : '🎮 Хочу пройти (+10 XP)') + '</button>' +
    '</div>';
  }).join('') || '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted);">Ничего не найдено</div>';
}

function openGame(id) {
  var g = getAllGames().find(function(x) { return x.id === id; });
  if (!g) return;
  var added = getAddedGames();
  var isAdded = added.indexOf(g.id) !== -1;
  var stars = '★'.repeat(Math.round(g.rating)) + '☆'.repeat(5 - Math.round(g.rating));
  var platforms = (g.platforms || []).join(', ');
  
  document.getElementById('modal-box').innerHTML =
    '<button onclick="closeModal()" style="position:absolute;top:16px;right:16px;background:none;border:none;font-size:1.5rem;cursor:pointer;">✕</button>' +
    '<div style="font-size:4rem; text-align:center;">' + g.icon + '</div>' +
    '<h2 style="text-align:center; margin:12px 0;">' + g.name + '</h2>' +
    '<div style="text-align:center; color:var(--muted); margin-bottom:16px;">' + g.developer + ' · ' + g.year + ' · ' + platforms + '</div>' +
    '<div style="display:flex; justify-content:center; gap:20px; margin-bottom:20px;">' +
      '<div style="text-align:center;"><div style="font-size:1.5rem; color:#f59e0b;">' + stars + '</div><div style="font-size:0.85rem; color:var(--muted);">Наш рейтинг</div></div>' +
      '<div style="text-align:center;"><div style="font-size:1.5rem; color:#64748b;">' + g.mc_rating + '</div><div style="font-size:0.85rem; color:var(--muted);">Metacritic</div></div>' +
    '</div>' +
    '<p style="line-height:1.6; font-size:1.05rem; margin-bottom:20px;">' + g.desc + '</p>' +
    '<button class="btn-add ' + (isAdded ? 'added' : '') + '" onclick="toggleGame(\'' + g.id + '\', \'' + g.name + '\'); closeModal();">' + (isAdded ? '✅ Уже в списке' : '🎮 Хочу пройти (+10 XP)') + '</button>';
  document.getElementById('modal').classList.add('open');
}

function toggleGame(id, name) {
  var added = getAddedGames();
  var idx = added.indexOf(id);
  if (idx === -1) {
    added.push(id);
    localStorage.setItem('otd_gaming_library_added', JSON.stringify(added));
    window.OTD_IDENTITY.addXP(10);
    window.OTD_CHRONICLE.add('🎮 Добавил в библиотеку: ' + name);
    alert('✅ Добавлено! +10 XP');
  } else {
    added.splice(idx, 1);
    localStorage.setItem('otd_gaming_library_added', JSON.stringify(added));
    alert('Убрано из списка');
  }
  renderGames();
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

document.getElementById('search-input').addEventListener('input', function(e) {
  searchQuery = e.target.value;
  renderGames();
});

document.getElementById('ai-library').innerHTML = window.OTD_IDENTITY.getGreeting() + '<br><br>🎮 Не знаешь, во что поиграть? Здесь 60 проверенных игр с рейтингами Metacritic и описаниями!';

renderGenreTabs();
renderGames();
</script>
</body>
</html>
