<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Звуки природы</title>
<link rel="stylesheet" href="../../css/styles.css">
<style>
.sound-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 24px; }
.sound-card { background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 16px 10px; cursor: pointer; text-align: center; transition: .2s; }
.sound-card:hover { transform: translateY(-2px); border-color: var(--accent); }
.sound-card.active { border-color: var(--accent); background: rgba(16,185,129,.1); }
.sound-icon { font-size: 2rem; }
.sound-name { font-weight: 700; font-size: .9rem; margin-top: 4px; }
.volume-row { display: flex; align-items: center; gap: 14px; margin: 16px 0; }
.volume-row input { flex: 1; }
.sound-desc { font-size: .75rem; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="index.html" class="btn-outline">← Назад</a>
    <h2> Звуки природы</h2>
  </div>
  <div class="ai-box">
    <p id="ai-sound" style="font-size:.95rem;font-style:italic;"></p>
  </div>
  <h3 style="margin-bottom:12px;font-size:1rem;">Выбери звук</h3>
  <div class="sound-grid" id="sound-list"></div>
  <div class="card">
    <div class="volume-row">
      <label style="font-weight:600;">🔊 Громкость</label>
      <input type="range" id="volume" min="0" max="100" value="30">
      <span id="volume-val" style="font-weight:700;">30%</span>
    </div>
    <button class="btn-primary" id="stop-btn" onclick="stopAll()" style="display:none;">⏹ Остановить</button>
  </div>
</div>

<script src="../../core/theme.js"></script>
<script src="../../core/chronicle.js"></script>
<script src="../../core/identity.js"></script>
<script src="data/sounds.js"></script>
<script>
var ctx = null, currentNode = null, currentId = null, intervalId = null;

function initAudio() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}

// Генераторы шума
function makeNoise(type) {
  var c = initAudio();
  var size = 2 * c.sampleRate;
  var buf = c.createBuffer(1, size, c.sampleRate);
  var out = buf.getChannelData(0);
  
  if (type === 'white') {
    for (var i = 0; i < size; i++) out[i] = Math.random() * 2 - 1;
  } else if (type === 'brown') {
    var lastOut = 0;
    for (var i = 0; i < size; i++) {
      var white = Math.random() * 2 - 1;
      out[i] = (lastOut + (0.02 * white)) / 1.02;
      lastOut = out[i];
      out[i] *= 3.5;
    }
  } else { // pink
    var b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
    for (var i = 0; i < size; i++) {
      var white = Math.random() * 2 - 1;
      b0 = 0.99886*b0 + white*0.0555179;
      b1 = 0.99332*b1 + white*0.0750759;
      b2 = 0.96900*b2 + white*0.1538520;
      b3 = 0.86650*b3 + white*0.3104856;
      b4 = 0.55000*b4 + white*0.5329522;
      b5 = -0.7616*b5 - white*0.0168980;
      out[i] = (b0+b1+b2+b3+b4+b5+b6+white*0.5362)*0.11;
      b6 = white*0.115926;
    }
  }
  return buf;
}

// УНИКАЛЬНЫЙ СИНТЕЗ ДЛЯ КАЖДОГО ЗВУКА
function playSound(id, vol) {
  stopAll();
  var c = initAudio();
  var master = c.createGain();
  master.gain.value = vol;
  master.connect(c.destination);
  var nodes = [];

  switch(id) {
    // 🌧️ ДОЖДЬ: розовый шум + highpass (шипение капель)
    case 'rain':
      var src = c.createBufferSource();
      src.buffer = makeNoise('pink');
      src.loop = true;
      var f = c.createBiquadFilter();
      f.type = 'highpass';
      f.frequency.value = 1200;
      src.connect(f);
      f.connect(master);
      src.start();
      nodes.push(src);
      break;

    //  ЛЕС: розовый шум + случайные птичьи пипы
    case 'forest':
      var src = c.createBufferSource();
      src.buffer = makeNoise('pink');
      src.loop = true;
      var f = c.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = 800;
      f.Q.value = 0.5;
      src.connect(f);
      f.connect(master);
      src.start();
      nodes.push(src);
      // Птичьи трели каждые 2-5 секунд
      intervalId = setInterval(function() {
        if (Math.random() < 0.3) {
          var osc = c.createOscillator();
          var gain = c.createGain();
          osc.frequency.value = 2000 + Math.random() * 3000;
          osc.type = 'sine';
          gain.gain.setValueAtTime(0, c.currentTime);
          gain.gain.linearRampToValueAtTime(0.1, c.currentTime + 0.01);
          gain.gain.linearRampToValueAtTime(0, c.currentTime + 0.1);
          osc.connect(gain);
          gain.connect(master);
          osc.start();
          osc.stop(c.currentTime + 0.1);
        }
      }, 500);
      break;

    //  ОКЕАН: коричневый шум + LFO (медленные волны)
    case 'ocean':
      var src = c.createBufferSource();
      src.buffer = makeNoise('brown');
      src.loop = true;
      var f = c.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 400;
      var lfo = c.createOscillator();
      lfo.frequency.value = 0.15;
      var lfoGain = c.createGain();
      lfoGain.gain.value = 250;
      lfo.connect(lfoGain);
      lfoGain.connect(f.frequency);
      lfo.start();
      src.connect(f);
      f.connect(master);
      src.start();
      nodes.push(src, lfo);
      break;

    // 🔥 КОСТЁР: коричневый шум + треск (импульсы)
    case 'fire':
      var src = c.createBufferSource();
      src.buffer = makeNoise('brown');
      src.loop = true;
      var f = c.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 600;
      src.connect(f);
      f.connect(master);
      src.start();
      nodes.push(src);
      // Треск каждые 100-300 мс
      intervalId = setInterval(function() {
        if (Math.random() < 0.4) {
          var noise = c.createBufferSource();
          noise.buffer = makeNoise('white');
          var gain = c.createGain();
          gain.gain.setValueAtTime(0.3, c.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, c.currentTime + 0.05);
          noise.connect(gain);
          gain.connect(master);
          noise.start();
          noise.stop(c.currentTime + 0.05);
        }
      }, 150);
      break;

    // 🎵 ЧАШИ: 4 синусоиды поющих чаш
    case 'bowls':
      var freqs = [261.6, 329.6, 392.0, 523.2];
      freqs.forEach(function(freq) {
        var osc = c.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq;
        var gain = c.createGain();
        gain.gain.value = 0.15;
        osc.connect(gain);
        gain.connect(master);
        osc.start();
        nodes.push(osc);
      });
      break;

    // 💨 ВЕТЕР: розовый шум + bandpass с модуляцией
    case 'wind':
      var src = c.createBufferSource();
      src.buffer = makeNoise('pink');
      src.loop = true;
      var f = c.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = 500;
      f.Q.value = 2;
      var lfo = c.createOscillator();
      lfo.frequency.value = 0.3;
      var lfoGain = c.createGain();
      lfoGain.gain.value = 300;
      lfo.connect(lfoGain);
      lfoGain.connect(f.frequency);
      lfo.start();
      src.connect(f);
      f.connect(master);
      src.start();
      nodes.push(src, lfo);
      break;

    // ⚡ ГРОЗА: коричневый шум + случайные удары
    case 'thunder':
      var src = c.createBufferSource();
      src.buffer = makeNoise('brown');
      src.loop = true;
      var f = c.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 300;
      src.connect(f);
      f.connect(master);
      src.start();
      nodes.push(src);
      // Удары грома каждые 3-8 секунд
      intervalId = setInterval(function() {
        if (Math.random() < 0.2) {
          var osc = c.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.value = 50 + Math.random() * 50;
          var gain = c.createGain();
          gain.gain.setValueAtTime(0.5, c.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, c.currentTime + 2);
          osc.connect(gain);
          gain.connect(master);
          osc.start();
          osc.stop(c.currentTime + 2);
        }
      }, 1000);
      break;

    // 🦗 СВЕРЧКИ: высокочастотные осцилляторы с ритмом
    case 'crickets':
      intervalId = setInterval(function() {
        var osc = c.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 4000 + Math.random() * 2000;
        var gain = c.createGain();
        gain.gain.setValueAtTime(0, c.currentTime);
        gain.gain.linearRampToValueAtTime(0.1, c.currentTime + 0.01);
        gain.gain.linearRampToValueAtTime(0, c.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(master);
        osc.start();
        osc.stop(c.currentTime + 0.05);
      }, 100);
      break;

    // 🏞️ РУЧЕЙ: белый шум + bandpass high
    case 'stream':
      var src = c.createBufferSource();
      src.buffer = makeNoise('white');
      src.loop = true;
      var f = c.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = 3000;
      f.Q.value = 1;
      src.connect(f);
      f.connect(master);
      src.start();
      nodes.push(src);
      break;

    // 🕉️ ДРОН ОМ: 3 синусоиды с биениями
    case 'om':
      var freqs = [136.1, 138.5, 140.2];
      freqs.forEach(function(freq) {
        var osc = c.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq;
        var gain = c.createGain();
        gain.gain.value = 0.2;
        osc.connect(gain);
        gain.connect(master);
        osc.start();
        nodes.push(osc);
      });
      break;

    // 🌌 КОСМОС: розовый шум + delay (эхо)
    case 'space':
      var src = c.createBufferSource();
      src.buffer = makeNoise('pink');
      src.loop = true;
      var f = c.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 800;
      var delay = c.createDelay();
      delay.delayTime.value = 0.5;
      var feedback = c.createGain();
      feedback.gain.value = 0.4;
      src.connect(f);
      f.connect(delay);
      delay.connect(feedback);
      feedback.connect(delay);
      delay.connect(master);
      f.connect(master);
      src.start();
      nodes.push(src);
      break;

    // 🌊 ВОДОПАД: белый шум + lowpass (мощный поток)
    case 'waterfall':
      var src = c.createBufferSource();
      src.buffer = makeNoise('white');
      src.loop = true;
      var f = c.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 1500;
      src.connect(f);
      f.connect(master);
      src.start();
      nodes.push(src);
      break;
  }

  currentNode = { master: master, nodes: nodes };
  currentId = id;
  return true;
}

function stopAll() {
  if (intervalId) { clearInterval(intervalId); intervalId = null; }
  if (currentNode) {
    (currentNode.nodes || []).forEach(function(n) {
      try { n.stop(); } catch(e) {}
    });
    if (currentNode.master) try { currentNode.master.disconnect(); } catch(e) {}
    currentNode = null;
  }
  currentId = null;
  document.querySelectorAll('.sound-card').forEach(function(c) { c.classList.remove('active'); });
  document.getElementById('stop-btn').style.display = 'none';
}

document.getElementById('volume').addEventListener('input', function(e) {
  var v = parseInt(e.target.value);
  document.getElementById('volume-val').textContent = v + '%';
  if (currentNode && currentNode.master) currentNode.master.gain.value = v / 100;
});

function renderSounds() {
  var sounds = window.OTD_MED_SOUNDS || [
    {id:'rain',name:'Дождь',icon:'🌧️'},
    {id:'forest',name:'Лес',icon:'🌲'},
    {id:'ocean',name:'Океан',icon:''},
    {id:'fire',name:'Костёр',icon:'🔥'},
    {id:'bowls',name:'Чаши',icon:'🎵'},
    {id:'wind',name:'Ветер',icon:'💨'},
    {id:'thunder',name:'Гроза',icon:'⚡'},
    {id:'crickets',name:'Сверчки',icon:'🦗'},
    {id:'stream',name:'Ручей',icon:'🏞️'},
    {id:'om',name:'Дрон ОМ',icon:'🕉️'},
    {id:'space',name:'Космос',icon:'🌌'},
    {id:'waterfall',name:'Водопад',icon:'🌊'}
  ];
  document.getElementById('sound-list').innerHTML = sounds.map(function(s) {
    return '<div class="sound-card' + (s.id === currentId ? ' active' : '') + '" data-id="' + s.id + '">' +
      '<div class="sound-icon">' + s.icon + '</div>' +
      '<div class="sound-name">' + s.name + '</div>' +
    '</div>';
  }).join('');
  document.querySelectorAll('.sound-card').forEach(function(c) {
    c.addEventListener('click', function() {
      var id = c.dataset.id;
      if (currentId === id) { stopAll(); renderSounds(); }
      else {
        playSound(id, parseInt(document.getElementById('volume').value) / 100);
        document.getElementById('stop-btn').style.display = 'block';
        renderSounds();
      }
    });
  });
}

document.getElementById('ai-sound').innerHTML = window.OTD_IDENTITY.getGreeting() + '<br><br>💡 Все 12 звуков генерируются математически — каждый уникален (0 МБ файлов).';
renderSounds();
window.addEventListener('beforeunload', function() { stopAll(); });
</script>
</body>
</html>
