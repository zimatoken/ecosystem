<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🩹 Первая помощь</title><link rel="stylesheet" href="../../css/styles.css">
<script>(function(){if(localStorage.getItem('ecosystem_theme_universal_v2')==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
<style>
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.tab { padding: 12px 18px; border: 2px solid var(--border); border-radius: 10px; background: var(--card); cursor: pointer; font-weight: 700; font-size: .95rem; transition: .2s; font-family: inherit; color: var(--text); }
.tab:hover { border-color: var(--accent); }
.tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.section-title { font-size: 1.3rem; font-weight: 800; margin: 20px 0 12px; color: var(--accent); }

.cpr-block { background: var(--card); border: 3px solid #dc2626; border-radius: 16px; padding: 24px; text-align: center; margin: 20px 0; }
.cpr-icon { font-size: 5rem; margin-bottom: 12px; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
.cpr-meter { font-size: 3rem; font-weight: 900; color: #dc2626; margin: 12px 0; }
.cpr-beat { width: 100px; height: 100px; margin: 20px auto; border-radius: 50%; background: #dc2626; box-shadow: 0 0 0 0 rgba(220,38,38,0.7); transition: .1s; }
.cpr-beat.beat { animation: beat 0.545s ease; }
@keyframes beat { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220,38,38,0.7); } 50% { transform: scale(1.3); box-shadow: 0 0 0 30px rgba(220,38,38,0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220,38,38,0); } }

.cpr-controls { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
.btn-cpr { padding: 14px 28px; border-radius: 12px; font-weight: 800; font-size: 1.05rem; cursor: pointer; border: none; font-family: inherit; }

.step-grid { display: grid; gap: 12px; margin: 16px 0; }
.step-card { background: var(--card); border-left: 5px solid var(--accent); border-radius: 10px; padding: 16px; display: flex; gap: 14px; align-items: flex-start; }
.step-card .num { background: var(--accent); color: #fff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; flex-shrink: 0; }
.step-card .txt { flex: 1; line-height: 1.6; }
.step-card.warn { border-left-color: #dc2626; }
.step-card.warn .num { background: #dc2626; }

.state-card { background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 12px; cursor: pointer; transition: .2s; }
.state-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.state-card .head { display: flex; align-items: center; gap: 12px; }
.state-card .icon { font-size: 2.5rem; }
.state-card .name { font-weight: 800; font-size: 1.15rem; }
.state-card .hint { font-size: .9rem; color: var(--muted); margin-top: 4px; }
.state-card.open .detail { display: block; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
.detail { display: none; }
</style>
</head><body>
<div class="container">
<div class="header"><a href="../../index.html" class="btn btn-outline">← На главную</a><h2>🩹 Первая помощь</h2></div>

<div class="danger-box">🚨 ПРИ УГРОЗЕ ЖИЗНИ — ЗВОНИ 103 НЕМЕДЛЕННО!</div>

<div class="tabs">
  <button class="tab active" onclick="pickTab('cpr', this)">🫀 СЛР-тренажёр</button>
  <button class="tab" onclick="pickTab('states', this)">📋 8 состояний</button>
  <button class="tab" onclick="pickTab('heimlich', this)">😷 Приём Геймлиха</button>
</div>

<div id="content"></div>
</div>

<script src="../../core/store.js"></script>
<script src="../../core/achievements.js"></script>
<script>
var currentTab = 'cpr';
var cprInterval = null;
var audioCtx = null;

function pickTab(id, el) {
  currentTab = id;
  document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
  el.classList.add('active');
  renderTab();
}

function renderTab() {
  if (currentTab === 'cpr') renderCPR();
  else if (currentTab === 'states') renderStates();
  else if (currentTab === 'heimlich') renderHeimlich();
}

// ═══ СЛР-ТРЕНАЖЁР ═══
function renderCPR() {
  document.getElementById('content').innerHTML =
    '<div class="card" style="border-left:5px solid #dc2626;">' +
      '<h3 style="margin-top:0;">🫀 СЛР — Сердечно-лёгочная реанимация</h3>' +
      '<p>Норма: <b>30 нажатий + 2 вдоха</b>. Частота нажатий: <b>100-120 в минуту</b>.</p>' +
    '</div>' +

    '<div class="cpr-block">' +
      '<div class="cpr-icon">🫀</div>' +
      '<div class="cpr-meter"><span id="cpr-bpm">0</span> <small style="font-size:1rem;">уд/мин</small></div>' +
      '<div class="cpr-beat" id="cpr-beat"></div>' +
      '<p style="font-size:1.1rem;font-weight:700;">Нажатие <span id="cpr-count">0</span> из 30</p>' +
      '<div class="cpr-controls">' +
        '<button class="btn-cpr" style="background:#16a34a;color:#fff;" onclick="startCPR()">▶️ Начать тренировку</button>' +
        '<button class="btn-cpr" style="background:#dc2626;color:#fff;" onclick="stopCPR()">⏹ Стоп</button>' +
      '</div>' +
      '<p style="color:var(--muted);margin-top:12px;font-size:.9rem;">Метроном: 110 уд/мин (норма СЛР). Слушай ритм и нажимай в такт.</p>' +
    '</div>' +

    '<div class="section-title">📋 Пошаговая инструкция</div>' +
    '<div class="step-grid">' +
      '<div class="step-card"><div class="num">1</div><div class="txt"><b>Проверь безопасность</b> — нет ли машин, огня, обстрела. Убедись, что тебе и пострадавшему ничего не угрожает.</div></div>' +
      '<div class="step-card"><div class="num">2</div><div class="txt"><b>Проверь сознание</b> — потряси за плечи: «Вы меня слышите?» Если нет — действуй!</div></div>' +
      '<div class="step-card"><div class="num">3</div><div class="txt"><b>Вызови 103</b> — громко скажи, что нужна скорая. Если есть помощник — пусть звонит.</div></div>' +
      '<div class="step-card"><div class="num">4</div><div class="txt"><b>Проверь дыхание</b> — не более 10 секунд. Наклонись к лицу, смотри на грудь. Нет дыхания — начинай СЛР.</div></div>' +
      '<div class="step-card"><div class="num">5</div><div class="txt"><b>Уложи на твёрдую поверхность</b>, расстегни одежду. Руки в центр груди (середина грудной клетки).</div></div>' +
      '<div class="step-card"><div class="num">6</div><div class="txt"><b>30 нажатий</b> — глубина 5-6 см, частота 100-120/мин. Руки прямые, не сгибай в локтях.</div></div>' +
      '<div class="step-card"><div class="num">7</div><div class="txt"><b>2 вдоха</b> — «рот в рот» или «рот в нос». Голова запрокинута, нос зажат.</div></div>' +
      '<div class="step-card warn"><div class="num">!</div><div class="txt"><b>НЕ ПРЕКРАЩАЙ</b> до приезда скорой! Даже если устал — продолжай. Меняйся с помощником каждые 2 минуты.</div></div>' +
    '</div>' +

    '<div class="card" style="background:#fee2e2;">' +
      '<h3 style="color:#dc2626;margin-top:0;">⛔ ЧТО НЕ ДЕЛАТЬ</h3>' +
      '<ul style="line-height:1.9;">' +
        '<li>НЕ нажимай на живот — только грудная клетка!</li>' +
        '<li>НЕ прекращай СЛР раньше 30 минут</li>' +
        '<li>НЕ бойся сломать рёбра — жизнь важнее</li>' +
        '<li>НЕ давай пить/есть — риск удушья</li>' +
        '<li>НЕ оставляй одного</li>' +
      '</ul>' +
    '</div>';
}

function startCPR() {
  stopCPR();
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { audioCtx = null; }
  }
  var count = 0;
  var beat = 0;
  var interval = 60000 / 110; // 110 уд/мин

  cprInterval = setInterval(function () {
    // Визуальный пульс
    var el = document.getElementById('cpr-beat');
    if (el) {
      el.classList.remove('beat');
      void el.offsetWidth;
      el.classList.add('beat');
    }

    // Звук метронома
    if (audioCtx) {
      try {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch (e) {}
    }

    count++;
    beat++;
    if (count > 30) count = 1;
    var el = document.getElementById('cpr-count');
    if (el) el.textContent = count;
    var bpm = document.getElementById('cpr-bpm');
    if (bpm) bpm.textContent = 110;
  }, interval);
}

function stopCPR() {
  if (cprInterval) { clearInterval(cprInterval); cprInterval = null; }
  var bpm = document.getElementById('cpr-bpm');
  if (bpm) bpm.textContent = 0;
  var el = document.getElementById('cpr-count');
  if (el) el.textContent = 0;
}

// ═══ 8 СОСТОЯНИЙ ═══
var STATES = [
  { id: 'unconscious', icon: '😵', name: 'Отсутствие сознания', hint: 'Проверь дыхание, уложи на бок',
    steps: ['Проверь безопасность', 'Потряси за плечи: «Слышите?»', 'Проверь дыхание 10 сек', 'Нет дыхания — СЛР', 'Дышит — уложи на бок (восстановительное положение)'] },
  { id: 'no_breath', icon: '🫁', name: 'Остановка дыхания', hint: 'СЛР 30:2 НЕМЕДЛЕННО',
    steps: ['Вызови 103', 'Уложи на твёрдую поверхность', '30 нажатий (глубина 5-6 см)', '2 вдоха', 'Продолжай до скорой'] },
  { id: 'bleeding', icon: '🩸', name: 'Наружное кровотечение', hint: 'Жгут / давящая повязка',
    steps: ['Определи тип (алая/тёмная/сочится)', 'При артериальном — жгут ВЫШЕ раны', 'Запиши ВРЕМЯ жгута', 'При венозном — давящая повязка', 'Подними выше сердца'] },
  { id: 'choking', icon: '😷', name: 'Инородное тело в дыхательных путях', hint: 'Приём Геймлиха',
    steps: ['Спроси: «Ты подавился?»', '5 ударов между лопатками', 'Приём Геймлиха', 'Чередуй 5+5', 'Потерял сознание — СЛР'] },
  { id: 'trauma', icon: '🦴', name: 'Травмы', hint: 'Иммобилизация + холод',
    steps: ['Не перемещай без нужды', 'При открытом переломе — останови кровь', 'Шина: фиксируй 2 сустава', 'Холод 20 мин', 'Обезболивающее'] },
  { id: 'burns', icon: '🔥', name: 'Ожоги', hint: 'Охлаждай водой 15-20 мин',
    steps: ['Прекрати действие фактора', 'Охлаждай прохладной водой 15-20 мин', 'НЕ прокалывай пузыри', 'Накрой стерильной салфеткой', 'При 3-4 ст. — СКОРАЯ'] },
  { id: 'frostbite', icon: '❄️', name: 'Обморожение', hint: 'Согревай ПОСТЕПЕННО',
    steps: ['Занеси в тепло', 'Сними мокрую одежду', 'Тёплые ванны 37-40°C', 'НЕ растирай снегом!', 'НЕ давай алкоголь'] },
  { id: 'poisoning', icon: '🤢', name: 'Отравления', hint: 'При химии — НЕ вызывай рвоту!',
    steps: ['Определи чем отравился', 'При пищевом — вызови рвоту', 'При химии — НЕ вызывай!', 'Активированный уголь', 'Обильное питьё'] }
];

function renderStates() {
  document.getElementById('content').innerHTML =
    '<div class="card" style="border-left:5px solid var(--accent);">' +
      '<h3 style="margin-top:0;">📋 8 состояний (Приказ № 477н)</h3>' +
      '<p>Нажми на состояние — увидишь пошаговые действия.</p>' +
    '</div>' +
    STATES.map(function (s) {
      return '<div class="state-card" onclick="toggleState(this)">' +
        '<div class="head">' +
          '<div class="icon">' + s.icon + '</div>' +
          '<div><div class="name">' + s.name + '</div><div class="hint">' + s.hint + '</div></div>' +
        '</div>' +
        '<div class="detail">' +
          '<ol style="line-height:1.9;padding-left:22px;">' +
            s.steps.map(function (st) { return '<li>' + st + '</li>'; }).join('') +
          '</ol>' +
        '</div>' +
      '</div>';
    }).join('');
}

function toggleState(el) {
  el.classList.toggle('open');
}

// ═══ ПРИЁМ ГЕЙМЛИХА ═══
function renderHeimlich() {
  document.getElementById('content').innerHTML =
    '<div class="card" style="border-left:5px solid #dc2626;">' +
      '<h3 style="margin-top:0;">😷 Приём Геймлиха</h3>' +
      '<p>Если человек подавился и <b>не может дышать/говорить</b>.</p>' +
    '</div>' +

    '<div class="step-grid">' +
      '<div class="step-card"><div class="num">1</div><div class="txt"><b>Спроси:</b> «Ты подавился?» Если кивает — действуй!</div></div>' +
      '<div class="step-card"><div class="num">2</div><div class="txt"><b>5 ударов ладонью</b> между лопатками. Наклони вперёд.</div></div>' +
      '<div class="step-card"><div class="num">3</div><div class="txt"><b>Встань позади.</b> Обхвати руками.</div></div>' +
      '<div class="step-card"><div class="num">4</div><div class="txt"><b>Кулак чуть выше пупка</b>, второй рукой накрой.</div></div>' +
      '<div class="step-card"><div class="num">5</div><div class="txt"><b>Резко надави вверх-внутрь 5 раз.</b></div></div>' +
      '<div class="step-card"><div class="num">6</div><div class="txt"><b>Чередуй:</b> 5 ударов + 5 нажатий.</div></div>' +
      '<div class="step-card warn"><div class="num">!</div><div class="txt"><b>Если потерял сознание</b> — уложи и начинай СЛР 30:2.</div></div>' +
    '</div>' +

    '<div class="card" style="background:#fef3c7;color:#78350f;">' +
      '<h3 style="margin-top:0;">👶 Для ребёнка до 1 года</h3>' +
      '<ol style="line-height:1.9;">' +
        '<li>Положи на предплечье лицом вниз</li>' +
        '<li>5 ударов между лопатками</li>' +
        '<li>Переверни, 5 нажатий на грудь (2 пальца)</li>' +
        '<li>Чередуй до выхода предмета</li>' +
      '</ol>' +
    '</div>' +

    '<div class="card" style="background:#fee2e2;">' +
      '<h3 style="color:#dc2626;margin-top:0;">⛔ ЧТО НЕ ДЕЛАТЬ</h3>' +
      '<ul style="line-height:1.9;">' +
        '<li>НЕ бей по спине сидящего — предмет уйдёт глубже</li>' +
        '<li>НЕ лезь пальцем вслепую</li>' +
        '<li>НЕ давай пить</li>' +
      '</ul>' +
    '</div>';
}

// Останавливаем СЛР при смене вкладки
var origPickTab = pickTab;
pickTab = function(id, el) {
  stopCPR();
  origPickTab(id, el);
};

renderTab();
</script></body></html>
