<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>📔 Дневник</title><link rel="stylesheet" href="../../css/styles.css"></head><body><div class="container"><div class="header"><a href="../../index.html" class="btn btn-outline">← Назад</a><h2>📔 Дневник здоровья</h2></div><div class="card"><input id="w" placeholder="Кто / что" style="width:100%;padding:12px;margin-bottom:10px;border:2px solid #fecaca;border-radius:8px;font-size:1rem;"><textarea id="t" placeholder="Что произошло" style="width:100%;padding:12px;margin-bottom:10px;border:2px solid #fecaca;border-radius:8px;min-height:80px;font-size:1rem;"></textarea><button class="btn btn-block" onclick="sv()">💾 Сохранить</button></div><div id="e"></div></div><script src="../../core/store.js"></script><script>function r(){var l=window.AIB_STORE.getJournal().reverse();document.getElementById("e").innerHTML=l.length?l.map(function(x){return "<div class=\"card\"><small>"+new Date(x.date).toLocaleString("ru")+"</small><br><b>"+(x.who||"—")+"</b><br>"+x.text+"</div>";}).join(""):"<div class=\"card\" style=\"text-align:center;color:#6b7280;\">📔 Записей пока нет</div>";}function sv(){var w=document.getElementById("w").value;var t=document.getElementById("t").value;if(!t)return alert("Заполни текст");window.AIB_STORE.addJournal({who:w,text:t});document.getElementById("t").value="";document.getElementById("w").value="";alert("✅ Сохранено");r();}r();</script></body></html>
