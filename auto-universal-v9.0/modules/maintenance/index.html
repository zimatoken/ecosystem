<script>
function render() {
  const g = window.GARAGE.get();
  const carFilter = document.getElementById('car-sel').value;
  const content = document.getElementById('content');

  if (!g.length) {
    content.innerHTML = '<div class="card" style="text-align:center;padding:40px;">' +
      '<div style="font-size:4rem;">📅</div>' +
      '<h3>Сначала добавь машину</h3>' +
      '<a href="../encyclopedia/index.html" class="btn">📖 Энциклопедия</a></div>';
    return;
  }

  const items = [];
  g.forEach(item => {
    if (carFilter && item.id !== carFilter) return;
    const car = window.AUTO_GET_CAR(item.id);
    if (!car) return;
    const mileage = item.mileage || 0;

    car.maintenance && Object.entries(car.maintenance).forEach(([k, v]) => {
      if (k.endsWith('_km') && typeof v === 'number') {
        const type = k.replace('_km', '');
        const interval = v;
        const sinceLast = mileage % interval;
        const left = interval - sinceLast;
        const status = sinceLast > interval * 0.9 ? 'over' : (sinceLast > interval * 0.7 ? 'soon' : '');
        const labels = {
          oil_change: '🛢️ Замена масла',
          tire_change: '🛞 Замена шин',
          brake_pads_front: '🛑 Колодки передние',
          brake_pads_rear: '🛑 Колодки задние',
          timing_belt: '⚙️ Ремень ГРМ',
          air_filter: '💨 Воздушный фильтр',
          cabin_filter: '❄️ Салонный фильтр',
          spark_plugs: '⚡ Свечи зажигания',
          coolant: '💧 Антифриз'
        };
        items.push({
          car: car.meta.brand + ' ' + car.meta.model,
          icon: car.meta.icon,
          label: labels[type] || type,
          interval, mileage, left, status
        });
      }
    });
  });

  if (!items.length) {
    content.innerHTML = '<div class="card"><p>Нет данных ТО</p></div>';
    return;
  }

  items.sort((a, b) => a.left - b.left);
  content.innerHTML = items.map(it =>
    '<div class="to-item ' + it.status + '">' +
    '<h3>' + it.label + ' <span class="to-km ' + it.status + '">' + it.left.toLocaleString() + ' км</span></h3>' +
    '<p style="margin:6px 0;color:var(--muted);font-size:.9rem;">' + it.icon + ' ' + it.car + '</p>' +
    '<p style="margin:6px 0;">Интервал: ' + it.interval.toLocaleString() + ' км · Пробег: ' + it.mileage.toLocaleString() + ' км</p>' +
    '</div>'
  ).join('');
}

const sel = document.getElementById('car-sel');
window.GARAGE.get().forEach(item => {
  const car = window.AUTO_GET_CAR(item.id);
  if (!car) return;
  const o = document.createElement('option');
  o.value = item.id;
  o.textContent = car.meta.icon + ' ' + car.meta.brand + ' ' + car.meta.model;
  sel.appendChild(o);
});
sel.addEventListener('change', render);
document.addEventListener('DOMContentLoaded', render);
</script>
