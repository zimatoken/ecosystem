.compare-grid {

.compare-cell {

  text-align: center; display: flex; align-items: center; justify-content: center;
}
.compare-cell.label {
  font-weight: 700; text-align: left; justify-content: flex-start;
  background: var(--bg-soft); color: var(--accent);
  text-transform: uppercase; font-size: .8rem; letter-spacing: .5px;
}
.compare-cell.head {
  flex-direction: column; gap: 6px;
  border: 2px solid var(--accent); padding: 16px 12px;
}
.compare-cell.head .c-icon { font-size: 3rem; }
.compare-cell.head .c-name { font-weight: 800; font-size: 1rem; }
.compare-cell.best { background: #dcfce7; border-color: #16a34a; font-weight: 700; }
[data-theme="dark"] .compare-cell.best { background: #14532d; color: #bbf7d0; }
</style>

<script>
function getIdsFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const ids = params.get('ids');
  return ids ? ids.split(',').filter(x => x) : [];
}

function render() {
  const ids = getIdsFromUrl();
  document.getElementById('count').textContent = ids.length;

  const el = document.getElementById('compare-content');
  if (ids.length < 2) {
    el.innerHTML = '<div class="card" style="text-align:center;padding:40px;">' +
      '<div style="font-size:4rem;">🔄</div>' +
      '<h3>Выбери минимум 2 машины</h3>' +
      '<p style="color:var(--muted);">Открой <a href="../encyclopedia/index.html" style="color:var(--accent);">Энциклопедию</a> и поставь галочки у машин.</p>' +
    '</div>';
    return;
  }

  const cars = ids.map(id => window.AUTO_GET_CAR(id)).filter(c => c);

  // Находим лучшие значения
  const best = {
    power_hp: Math.max(...cars.map(c => c.specs.power_hp)),
    acceleration_0_100: Math.min(...cars.map(c => c.specs.acceleration_0_100)),
    fuel_consumption_city: Math.min(...cars.map(c => c.specs.fuel_consumption_city)),
    fuel_consumption_highway: Math.min(...cars.map(c => c.specs.fuel_consumption_highway)),
    max_speed: Math.max(...cars.map(c => c.specs.max_speed)),
    trunk_volume: Math.max(...cars.map(c => c.specs.trunk_volume))
  };

  const rows = [
    { label: 'Регион',       values: cars.map(c => c.meta.country) },
    { label: 'Годы',         values: cars.map(c => c.meta.year_from + '–' + c.meta.year_to) },
    { label: 'Тип',          values: cars.map(c => window.LABELS.type(c.meta.type)) },
    { label: 'Класс',        values: cars.map(c => window.LABELS.segment(c.meta.segment)) },
    { label: 'Привод',       values: cars.map(c => window.LABELS.drive(c.meta.drive)) },
    { label: 'Двигатель',    values: cars.map(c => c.specs.engine_volume + ' л') },
    { label: 'Мощность',     values: cars.map(c => c.specs.power_hp + ' л.с.'), bestKey: 'power_hp', field: 'power_hp' },
    { label: 'Разгон 0–100', values: cars.map(c => c.specs.acceleration_0_100 + ' с'), bestKey: 'acceleration_0_100', field: 'acceleration_0_100' },
    { label: 'Макс. скорость', values: cars.map(c => c.specs.max_speed + ' км/ч'), bestKey: 'max_speed', field: 'max_speed' },
    { label: 'Расход город', values: cars.map(c => c.specs.fuel_consumption_city + ' л'), bestKey: 'fuel_consumption_city', field: 'fuel_consumption_city' },
    { label: 'Расход трасса', values: cars.map(c => c.specs.fuel_consumption_highway + ' л'), bestKey: 'fuel_consumption_highway', field: 'fuel_consumption_highway' },
    { label: 'Бак',          values: cars.map(c => c.specs.fuel_tank + ' л') },
    { label: 'Багажник',     values: cars.map(c => c.specs.trunk_volume + ' л'), bestKey: 'trunk_volume', field: 'trunk_volume' },
    { label: 'Мест',         values: cars.map(c => c.specs.seats) }
  ];

  let html = '<div class="compare-grid">';

  // Заголовки
  html += '<div class="compare-cell label">Параметр</div>';
  cars.forEach(c => {
    html += '<div class="compare-cell head">' +
      '<div class="c-icon">' + c.meta.icon + '</div>' +
      '<div class="c-name">' + c.meta.brand + ' ' + c.meta.model + '</div>' +
    '</div>';
  });

  // Строки
  rows.forEach(row => {
    html += '<div class="compare-cell label">' + row.label + '</div>';
    cars.forEach((c, i) => {
      let isBest = false;
      if (row.bestKey && c.specs[row.bestKey] === best[row.bestKey]) isBest = true;
      html += '<div class="compare-cell ' + (isBest ? 'best' : '') + '">' + row.values[i] + '</div>';
    });
  });

  html += '</div>';
  el.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', render);
</script>
