<style>
.garage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.garage-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px; border-left: 5px solid var(--accent); }
.garage-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.garage-icon { font-size: 2.5rem; }
.garage-name { font-weight: 800; font-size: 1.15rem; }
.mileage-block { padding: 12px; background: var(--bg-soft); border-radius: 8px; margin-bottom: 10px; }
.mileage-input { display: flex; gap: 8px; margin-top: 6px; }
.mileage-input input { flex: 1; padding: 8px 12px; border: 2px solid var(--border); border-radius: 8px;
  background: var(--card); color: var(--text); font-size: 1rem; font-family: inherit; }
.mileage-input button { padding: 8px 14px; }
.progress-bar { height: 8px; background: var(--accent-soft); border-radius: 4px; overflow: hidden; margin: 6px 0; }
.progress-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.to-warning { padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; font-size: .9rem; }
.to-ok { background: #dcfce7; color: #166534; }
.to-soon { background: #fef3c7; color: #92400e; }
.to-over { background: #fee2e2; color: #991b1b; font-weight: 700; }
</style>

<script>
function render() {
  const g = window.GARAGE.get();
  const el = document.getElementById('garage');
  const empty = document.getElementById('empty');
  const s = window.GARAGE.getStats();

  document.getElementById('s-level').textContent = s.level;
  document.getElementById('s-xp').textContent = s.xp;
  document.getElementById('s-streak').textContent = s.streak;
  document.getElementById('s-cars').textContent = g.length;

  if (!g.length) {
    el.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  el.style.display = 'grid';
  empty.style.display = 'none';

  el.innerHTML = g.map(item => {
    const car = window.AUTO_GET_CAR(item.id);
    if (!car) return '';
    const mileage = item.mileage || 0;

    // Прогноз ТО
    const oilNext = car.maintenance.oil_change_km;
    const oilLeft = oilNext - (mileage % oilNext);
    const oilStatus = mileage % oilNext > oilNext * 0.9 ? 'to-soon' : 'to-ok';

    const tireNext = car.maintenance.tire_change_km || 50000;
    const tireLeft = tireNext - (mileage % tireNext);

    return (function() { var p = window.AUTO_PHOTOS.getFor(item.id); return '<div class="garage-card">' + (p ? '<img src="' + p + '" class="car-photo-thumb has-photo" alt="" onclick="uploadPhoto(\\'' + item.id + '\\')" style="cursor:pointer;">' : '<div class="photo-placeholder" onclick="uploadPhoto(\\'' + item.id + '\\')" style="cursor:pointer;">' + car.meta.icon + '</div>'); })() +
      '<div class="garage-head">' +
        '<div class="garage-icon">' + car.meta.icon + '</div>' +
        '<div><div class="garage-name">' + car.meta.brand + ' ' + car.meta.model + '</div>' +
        '<div style="font-size:.85rem;color:var(--muted);">' + window.LABELS.type(car.meta.type) + '</div></div>' +
      '</div>' +

      '<div class="mileage-block">' +
        '<div style="font-size:.85rem;color:var(--muted);">Текущий пробег</div>' +
        '<div style="font-size:1.4rem;font-weight:800;">' + mileage.toLocaleString() + ' км</div>' +
        '<div class="mileage-input">' +
          '<input type="number" id="mil-' + item.id + '" placeholder="Обновить км" value="' + mileage + '">' +
          '<button class="btn" onclick="updateMileage(\'' + item.id + '\')">OK</button>' +
        '</div>' +
      '</div>' +

      '<div class="to-warning ' + oilStatus + '">' +
        '🛢️ Масло: до замены ~' + Math.max(0, oilLeft) + ' км' +
      '</div>' +
      '<div class="to-warning to-ok">' +
        '🛞 Шины: до замены ~' + Math.max(0, tireLeft) + ' км' +
      '</div>' +

      '<div style="display:flex;gap:8px;margin-top:12px;">' +
        '<button class="btn" style="flex:1;" onclick="addMaintenance(\'' + item.id + '\')">🔧 + ТО</button>' +
        '<button class="btn btn-outline" onclick="removeCar(\'' + item.id + '\')">🗑</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function updateMileage(id) {
  const inp = document.getElementById('mil-' + id);
  const val = parseInt(inp.value) || 0;
  window.GARAGE.updateMileage(id, val);
  showToast('Пробег обновлён: ' + val.toLocaleString() + ' км');
  render();
}

function addMaintenance(id) {
  const types = [
    { id: 'oil_change', label: 'Замена масла', xp: 50 },
    { id: 'tire_change', label: 'Замена шин', xp: 30 },
    { id: 'filter_change', label: 'Замена фильтра', xp: 20 },
    { id: 'brake_change', label: 'Замена колодок', xp: 40 },
    { id: 'to_visit', label: 'Плановое ТО', xp: 25 }
  ];
  const choice = prompt('Выбери ТО:\n1. Замена масла\n2. Замена шин\n3. Замена фильтра\n4. Замена колодок\n5. Плановое ТО');
  const idx = parseInt(choice) - 1;
  if (idx < 0 || idx >= types.length) return;
  const t = types[idx];
  window.GARAGE.addMaintenance(id, { type: t.id, label: t.label });
  showToast('✅ ' + t.label + ' — +' + t.xp + ' XP');
  render();
}

function removeCar(id) {
  if (!confirm('Удалить машину из гаража?')) return;
  window.GARAGE.remove(id);
  render();
}

function uploadPhoto(carId) {
  window.AUTO_PHOTOS.pickAndSave(carId, function () {
    showToast('📷 Фото загружено');
    if (typeof render === 'function') render();
  });
}

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.className = 'toast show';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

document.addEventListener('DOMContentLoaded', render);
