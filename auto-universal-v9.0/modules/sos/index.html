<style>
.triggers { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.trigger { background: var(--card); border: 2px solid var(--border); border-radius: 12px;
  padding: 18px; cursor: pointer; transition: .2s; font-weight: 700; font-size: 1.1rem; }
.trigger:hover { border-color: var(--accent); transform: translateY(-2px); }
.q-block { margin-bottom: 20px; }
.q-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 10px; }
.q-options { display: flex; flex-wrap: wrap; gap: 8px; }
.q-opt { background: var(--card); border: 2px solid var(--border); padding: 12px 18px;
  border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 1rem;
  color: var(--text); font-family: inherit; transition: .15s; }
.q-opt:hover { border-color: var(--accent); }
.q-opt.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.solution { background: var(--card); border: 2px solid var(--accent); border-radius: 12px; padding: 24px; margin-top: 20px; }
.solution.critical { border-color: var(--danger); }
.solution h3 { color: var(--accent); margin-top: 0; font-size: 1.3rem; }
.solution.critical h3 { color: var(--danger); }
.solution ol { line-height: 1.9; padding-left: 22px; font-size: 1.05rem; }
.solution .warnings { background: #fef3c7; color: #92400e; border-radius: 8px; padding: 12px 14px; margin-top: 14px; font-weight: 600; }
.solution .info { display: flex; gap: 16px; margin-top: 14px; flex-wrap: wrap; }
.solution .info span { padding: 8px 14px; background: var(--bg-soft); border-radius: 8px; font-weight: 700; }
</style>

<script>
let currentTrigger = null;
let answers = {};

function renderTriggers() {
  const list = window.SOS_ENGINE.getAllTriggers();
  document.getElementById('content').innerHTML =
    '<div class="triggers">' +
    list.map(t => '<div class="trigger" onclick="startTrigger(\'' + t.id + '\')">' + t.label + '</div>').join('') +
    '</div>';
}

function startTrigger(id) {
  currentTrigger = window.SOS_ENGINE.getTrigger(id);
  if (!currentTrigger) return;
  answers = {};
  renderQuestions();
}

function renderQuestions() {
  let html = '<button class="btn btn-outline" onclick="renderTriggers()">← Назад</button>' +
    '<h3 style="margin-top:16px;">' + currentTrigger.label + '</h3>';
  currentTrigger.questions.forEach((q, i) => {
    html += '<div class="q-block"><div class="q-title">' + (i+1) + '. ' + q.text + '</div><div class="q-options">';
    q.options.forEach(o => {
      html += '<button class="q-opt" onclick="pick(\'' + q.id + '\',\'' + o.id + '\',this)">' + o.label + '</button>';
    });
    html += '</div></div>';
  });
  html += '<button class="btn btn-block" style="margin-top:20px;" onclick="showSolution()" id="show-btn" disabled>Показать решение</button>';
  document.getElementById('content').innerHTML = html;
}

function pick(qid, optid, btn) {
  answers[qid] = optid;
  btn.parentElement.querySelectorAll('.q-opt').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const allQ = currentTrigger.questions.length;
  const ansQ = Object.keys(answers).length;
  document.getElementById('show-btn').disabled = (ansQ < allQ);
}

function showSolution() {
  const sol = window.SOS_ENGINE.findSolution(currentTrigger.id, answers);
  const isCritical = sol.urgency === 'critical';
  let html = '<button class="btn btn-outline" onclick="renderTriggers()">← К списку</button>' +
    '<div class="solution ' + (isCritical ? 'critical' : '') + '" style="margin-top:16px;">' +
    '<div style="font-size:.9rem;font-weight:700;color:var(--muted);margin-bottom:8px;">' + window.LABELS.urgency(sol.urgency) + '</div>' +
    '<h3>' + sol.title + '</h3><ol>';
  sol.steps.forEach(s => { html += '<li>' + s + '</li>'; });
  html += '</ol>';
  if (sol.warnings) { html += '<div class="warnings">' + sol.warnings.join(' | ') + '</div>'; }
  html += '<div class="info">';
  if (sol.time_estimate) html += '<span>' + sol.time_estimate + '</span>';
  if (sol.cost_estimate) html += '<span>' + sol.cost_estimate + '</span>';
  html += '</div></div>';
  document.getElementById('content').innerHTML = html;
}

document.addEventListener('DOMContentLoaded', renderTriggers);
</script>
